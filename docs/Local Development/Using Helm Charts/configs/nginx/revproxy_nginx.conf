events {}

http {
    server {
        listen 3010 ssl;
        server_name caliper-training.ohsu.edu;

        # SSL configuration
        ssl_certificate /opt/homebrew/Cellar/nginx/1.27.1/fullchain.pem;
        ssl_certificate_key /opt/homebrew/Cellar/nginx/1.27.1/privkey.pem;

	    proxy_connect_timeout 15s;
	    proxy_send_timeout 15s;
		proxy_read_timeout 15s;

        # Default proxy to http://localhost:3000
        location / {
            proxy_pass http://localhost:3000;
        }

        # Proxy /_next/webpack-hmr to support hot reloading
        location /_next/webpack-hmr {
            proxy_pass http://localhost:3000/_next/webpack-hmr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Proxy /user to https://localhost/user
        location /user {
            proxy_pass https://caliper-training.ohsu.edu/user;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy /mds to https://localhost/mds
        location /mds {
            proxy_pass https://caliper-training.ohsu.edu/mds;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy /guppy to https://localhost/guppy
        location /guppy {
            proxy_pass https://caliper-training.ohsu.edu/guppy;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /grip/graphql {

    	    proxy_connect_timeout 60s;
    	    proxy_send_timeout 60s;
            proxy_read_timeout 60s;


            proxy_pass https://caliper-training.ohsu.edu/grip/graphql;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy /authz to https://localhost/authz
        location /authz {
            proxy_pass https://caliper-training.ohsu.edu/authz;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy /api/v0 to https://localhost/authz
        location /api/v0 {
            proxy_pass https://caliper-training.ohsu.edu/api/v0;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /user/login  {

            proxy_pass https://caliper-training.ohsu.edu/user/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /user/user  {
            proxy_pass https://caliper-training.ohsu.edu/user/user;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # Proxy /_status to https://localhost/_status
        location /_status {
            proxy_pass https://caliper-training.ohsu.edu/_status;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /image-viewer {
                proxy_pass https://caliper-training.ohsu.edu/image-viewer;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

        location /ExplorerConfig {
                proxy_pass https://caliper-training.ohsu.edu/ExplorerConfig;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /aviator {
            proxy_pass https://caliper-training.ohsu.edu/aviator;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

    }
}


