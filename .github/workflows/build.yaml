name: Build and publish Frontend-Framework Image

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      REPO: quay.io/ohsu-comp-bio/frontend-framework

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set branch name
        id: vars
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BRANCH="${GITHUB_HEAD_REF//\//_}"
          else
            BRANCH="${GITHUB_REF_NAME//\//_}"
          fi
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Build and push image
        run: |
          BRANCH="${{ steps.vars.outputs.branch }}"
          REPO="${{ env.REPO }}"
          echo "Building $REPO:$BRANCH"

          docker build -t "$REPO:$BRANCH" .

          # Tag as latest only for the feature/cbds branch (sanitized to feature_cbds)
          if [[ "$BRANCH" == "feature_cbds" ]]; then
            docker tag "$REPO:$BRANCH" "$REPO:latest"
          fi

          docker push "$REPO:$BRANCH"

          if [[ "$BRANCH" == "feature_cbds" ]]; then
            docker push "$REPO:latest"
          fi