name: Build and publish Frontend-Framework Image

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  build:
    if: >-
      (github.event.action == 'closed' && github.event.pull_request.merged) ||
      (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      REPO: quay.io/ohsu-comp-bio/frontend-framework

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merged && github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Set branch name
        id: vars
        env:
          IMAGE_BRANCH: ${{ github.event.pull_request.merged && github.base_ref || github.head_ref }}
        run: |
          BRANCH="${IMAGE_BRANCH//\//_}"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Build and push image
        env:
          BRANCH: ${{ steps.vars.outputs.branch }}
        run: |
          echo "Building $REPO:$BRANCH"

          docker build -t "$REPO:$BRANCH" .

          # Tag as latest only for the feature/cbds branch (sanitized to feature_cbds)
          if [[ "$BRANCH" == "feature_cbds" ]]; then
            docker tag "$REPO:$BRANCH" "$REPO:latest"
          fi

          docker push "$REPO:$BRANCH"

          if [[ "$BRANCH" == "feature_cbds" ]]; then
            docker push "$REPO:latest"
          fi
