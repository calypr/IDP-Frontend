name: Build and publish Frontend-Framework Image

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  check_pr:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      open_pr: ${{ steps.pr.outputs.open_pr }}
    steps:
      - name: Check for an open pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OPEN_PR_COUNT=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=open \
            -f head="${GITHUB_REPOSITORY_OWNER}:${GITHUB_REF_NAME}" \
            -f per_page=1 \
            --jq 'length')
          if [[ "$OPEN_PR_COUNT" -gt 0 ]]; then
            echo "open_pr=true" >> "$GITHUB_OUTPUT"
            echo "An open pull request will build this branch."
          fi

  build:
    needs: check_pr
    if: always() && (github.event_name != 'push' || (needs.check_pr.result == 'success' && needs.check_pr.outputs.open_pr != 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      REPO: quay.io/ohsu-comp-bio/frontend-framework

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set branch name
        id: vars
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BRANCH="${GITHUB_HEAD_REF//\//_}"
          else
            BRANCH="${GITHUB_REF_NAME//\//_}"
          fi
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Build and push image
        run: |
          BRANCH="${{ steps.vars.outputs.branch }}"
          REPO="${{ env.REPO }}"
          echo "Building $REPO:$BRANCH"

          docker build -t "$REPO:$BRANCH" .

          # Tag as latest only for the feature/cbds branch (sanitized to feature_cbds)
          if [[ "$BRANCH" == "feature_cbds" ]]; then
            docker tag "$REPO:$BRANCH" "$REPO:latest"
          fi

          docker push "$REPO:$BRANCH"

          if [[ "$BRANCH" == "feature_cbds" ]]; then
            docker push "$REPO:latest"
          fi
